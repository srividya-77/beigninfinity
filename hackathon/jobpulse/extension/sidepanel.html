<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JobPulse</title>
  <link rel="stylesheet" href="sidepanel.css" />
</head>
<body>
  <!-- Header -->
  <header class="header">
    <div class="header-left">
      <span class="logo-icon">⚡</span>
      <span class="logo-text">JobPulse</span>
    </div>
    <div class="header-right">
      <span class="account-count" id="accountCount">0 accounts</span>
      <div class="notif-badge" id="notifBadge" style="display:none;">
        <span id="notifCount">0</span>
      </div>
      <a class="website-link" href="https://beigninfinity-hackathon.onrender.com" target="_blank" title="Visit JobPulse website">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"/>
          <line x1="2" y1="12" x2="22" y2="12"/>
          <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
        </svg>
      </a>
    </div>
  </header>

  <!-- Alert Banner (shown when new high-priority item arrives) -->
  <div class="alert-banner" id="alertBanner" style="display:none;">
    <span class="alert-icon">🎯</span>
    <span id="alertText">New shortlist alert</span>
    <button class="alert-dismiss" id="alertDismiss">✕</button>
  </div>

  <!-- Account List -->
  <main class="main">
    <section class="accounts-section">
      <div class="section-header">
        <span class="section-title">Monitored Accounts</span>
        <button class="add-btn" id="addAccountBtn">+ Add account</button>
      </div>

      <div class="accounts-list" id="accountsList">
        <!-- Populated by sidepanel.js -->
      </div>

      <!-- Empty state -->
      <div class="empty-state" id="emptyState">
        <div class="empty-icon">📭</div>
        <p class="empty-title">No accounts yet</p>
        <p class="empty-sub">Add a Gmail account to start monitoring</p>
        <button class="empty-add-btn" id="emptyAddBtn">Connect Gmail account</button>
      </div>
    </section>

    <!-- Application Tracker -->
    <section class="tracker-section" id="trackerSection" style="display:none;">
      <div class="section-header">
        <span class="section-title">Application Pipeline</span>
        <span class="tracker-count" id="trackerCount">0 tracked</span>
      </div>
      <div class="tracker-list" id="trackerList">
        <!-- Populated by sidepanel.js -->
      </div>
    </section>
  </main>

  <!-- Footer -->
  <footer class="footer">
    <a class="footer-link" href="https://jobpulse.app" target="_blank">
      jobpulse.app — full dashboard &amp; docs ↗
    </a>
  </footer>

  <!-- Add Account Modal -->
  <div class="modal-overlay" id="modalOverlay" style="display:none;">
    <div class="modal">
      <div class="modal-header">
        <span class="modal-title">Connect a Gmail Account</span>
        <button class="modal-close" id="modalClose">✕</button>
      </div>
      <p class="modal-sub">Sign in with Google to let JobPulse monitor this inbox for shortlist signals.</p>
      <input class="modal-input" id="accountLabel" type="text" placeholder='Label (e.g. "Dev Applications")' maxlength="30" />
      <button class="modal-connect-btn" id="modalConnectBtn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
          <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
          <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
          <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/>
          <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
        </svg>
        Sign in with Google
      </button>
    </div>
  </div>

  <script src="sidepanel.js"></script>
</body>
</html>
